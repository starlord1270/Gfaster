[package]
name = "gfaster-rust"
version = "0.1.0"
edition = "2021"
authors = ["GFaster Team <starlord1270>"]
description = "High-performance GFaster Rust file indexing engine for Arch Linux"

[dependencies]
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
regex = "1.10"
sled = "0.34"
